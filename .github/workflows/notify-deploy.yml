name: Notify deploy
# Tells the data-management repo to rebuild and redeploy dev with this revision.
# Forks: set repo variable DEPLOY_REPO (repo name, same owner) to enable, and
# secret DEPLOY_DISPATCH_PAT (contents:write on that repo).
on:
  push:
    branches: [main]
permissions: {}
jobs:
  dispatch:
    if: vars.DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    steps:
      # before/after let the deploy re-import only what this push changed.
      - run: >-
          gh api "repos/${{ github.repository_owner }}/${{ vars.DEPLOY_REPO }}/dispatches"
          -f event_type=plugin-updated
          -f "client_payload[before]=$BEFORE" -f "client_payload[after]=$AFTER"
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_PAT }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
